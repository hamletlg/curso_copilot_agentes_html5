<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" width="800" height="640">
<title id="t">Los 5 componentes de un agente de IA</title>
<desc id="d">Diagrama radial: en el centro un agente de IA y alrededor sus cinco componentes, numerados del 1 al 5: percepción, razonamiento, herramientas, memoria y comunicación.</desc>
<rect width="800" height="640" fill="#FFFFFF"/>
<text x="400.0" y="46" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1E293B">Los 5 componentes de un agente de IA</text>
<line x1="400.0" y1="284.0" x2="400.0" y2="176.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="443.7" y1="315.8" x2="546.5" y2="282.4" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="427.0" y1="367.2" x2="490.5" y2="454.6" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="373.0" y1="367.2" x2="309.5" y2="454.6" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="356.3" y1="315.8" x2="253.5" y2="282.4" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="400" cy="330" r="78" fill="#2563EB"/>
<text x="400" y="324" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Agente</text>
<text x="400" y="350" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">de IA</text>
<circle cx="400.0" cy="130.0" r="46" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<text x="400.0" y="138.0" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2563EB">1</text>
<text x="414.0" y="202.0" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Percepción</text>
<text x="414.0" y="224.0" text-anchor="start" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#1E293B" opacity="0.75">escuchar y entender</text>
<circle cx="590.2" cy="268.2" r="46" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<text x="590.2" y="276.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2563EB">2</text>
<text x="590.2" y="340.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Razonamiento</text>
<text x="590.2" y="362.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#1E293B" opacity="0.75">pensar y planificar</text>
<circle cx="517.6" cy="491.8" r="46" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<text x="517.6" y="499.8" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2563EB">3</text>
<text x="517.6" y="563.8" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Herramientas</text>
<text x="517.6" y="585.8" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#1E293B" opacity="0.75">manos para actuar</text>
<circle cx="282.4" cy="491.8" r="46" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<text x="282.4" y="499.8" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2563EB">4</text>
<text x="282.4" y="563.8" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Memoria</text>
<text x="282.4" y="585.8" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#1E293B" opacity="0.75">recordar para mejorar</text>
<circle cx="209.8" cy="268.2" r="46" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<text x="209.8" y="276.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2563EB">5</text>
<text x="209.8" y="340.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Comunicación</text>
<text x="209.8" y="362.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#1E293B" opacity="0.75">hablar y entregar</text>
</svg>
