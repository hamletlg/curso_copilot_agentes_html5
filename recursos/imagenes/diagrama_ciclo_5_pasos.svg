<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="t d" width="760" height="760">
<title id="t">El ciclo de trabajo del agente (5 pasos)</title>
<desc id="d">Diagrama circular: cinco pasos en bucle, recibir, planificar, ejecutar, verificar y entregar, unidos por flechas que indican que el ciclo se repite.</desc>
<rect width="760" height="760" fill="#FFFFFF"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
<text x="380.0" y="46" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1E293B">El ciclo de trabajo del agente</text>
<circle cx="380" cy="400" r="235" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 7" opacity="0.45"/>
<line x1="436.6" y1="206.1" x2="540.4" y2="281.5" stroke="#2563EB" stroke-width="3" marker-end="url(#fl)"/>
<line x1="581.9" y1="394.0" x2="542.2" y2="515.9" stroke="#2563EB" stroke-width="3" marker-end="url(#fl)"/>
<line x1="448.1" y1="590.1" x2="319.9" y2="590.1" stroke="#2563EB" stroke-width="3" marker-end="url(#fl)"/>
<line x1="220.2" y1="523.5" x2="180.6" y2="401.6" stroke="#2563EB" stroke-width="3" marker-end="url(#fl)"/>
<line x1="213.1" y1="286.2" x2="316.9" y2="210.8" stroke="#2563EB" stroke-width="3" marker-end="url(#fl)"/>
<circle cx="380.0" cy="165.0" r="62" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<circle cx="426.0" cy="121.0" r="17" fill="#2563EB"/>
<text x="426.0" y="127.0" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
<text x="380.0" y="163.0" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Recibir</text>
<text x="380.0" y="185.0" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B" opacity="0.75">la orden</text>
<circle cx="603.5" cy="327.4" r="62" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<circle cx="649.5" cy="283.4" r="17" fill="#2563EB"/>
<text x="649.5" y="289.4" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
<text x="603.5" y="325.4" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Planificar</text>
<text x="603.5" y="347.4" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B" opacity="0.75">los pasos</text>
<circle cx="518.1" cy="590.1" r="62" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<circle cx="564.1" cy="546.1" r="17" fill="#2563EB"/>
<text x="564.1" y="552.1" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
<text x="518.1" y="588.1" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Ejecutar</text>
<text x="518.1" y="610.1" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B" opacity="0.75">las acciones</text>
<circle cx="241.9" cy="590.1" r="62" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<circle cx="287.9" cy="546.1" r="17" fill="#2563EB"/>
<text x="287.9" y="552.1" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
<text x="241.9" y="588.1" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Verificar</text>
<text x="241.9" y="610.1" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B" opacity="0.75">el resultado</text>
<circle cx="156.5" cy="327.4" r="62" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
<circle cx="202.5" cy="283.4" r="17" fill="#2563EB"/>
<text x="202.5" y="289.4" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">5</text>
<text x="156.5" y="325.4" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Entregar</text>
<text x="156.5" y="347.4" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B" opacity="0.75">y aprender</text>
<text x="380" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">El ciclo se repite</text>
<text x="380" y="418" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#1E293B" opacity="0.75">con cada nueva orden</text>
</svg>
