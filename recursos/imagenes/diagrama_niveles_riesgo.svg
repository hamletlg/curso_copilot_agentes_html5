<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" width="800" height="500">
<title id="t">Los cuatro niveles de riesgo del Reglamento de Inteligencia Artificial</title>
<desc id="d">Cuatro bandas de color, de más a menos restrictiva: riesgo inaceptable o prohibido, alto riesgo, riesgo limitado y riesgo mínimo, con un ejemplo en cada una.</desc>
<rect width="800" height="500" fill="#FFFFFF"/>
<text x="400" y="46" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1E293B">Los cuatro niveles de riesgo del Reglamento de Inteligencia Artificial</text>
<text x="400" y="74" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#1E293B" opacity="0.75">Cuanto mayor es el riesgo, más obligaciones (y más prohibiciones)</text>

<rect x="50" y="104" width="700" height="78" rx="10" fill="#991B1B"/>
<text x="76" y="137" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Riesgo inaceptable — prohibido</text>
<text x="76" y="163" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" opacity="0.92">Manipulación, puntuación social de personas, biometría en espacios públicos</text>

<rect x="50" y="194" width="700" height="78" rx="10" fill="#B45309"/>
<text x="76" y="227" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Alto riesgo</text>
<text x="76" y="253" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" opacity="0.92">Selección de personal, crédito, sanidad, educación: obligaciones estrictas</text>

<rect x="50" y="284" width="700" height="78" rx="10" fill="#1D4ED8"/>
<text x="76" y="317" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Riesgo limitado</text>
<text x="76" y="343" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" opacity="0.92">Chatbots y contenido generado: obligación de transparencia</text>

<rect x="50" y="374" width="700" height="78" rx="10" fill="#475569"/>
<text x="76" y="407" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Riesgo mínimo</text>
<text x="76" y="433" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" opacity="0.92">Filtros de correo, recomendaciones: sin obligaciones específicas</text>

<text x="400" y="482" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Lo que clasifica el riesgo es el uso concreto, no la herramienta</text>
</svg>
